[project]
name = "bandcamp-scout"
version = "0.1.0"
description = "Find your tracks on Bandcamp and report which are free, name-your-price or paid"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "rapidfuzz>=3.9"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]  # `scout gui` only

[project.scripts]
scout = "bandcamp_scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
